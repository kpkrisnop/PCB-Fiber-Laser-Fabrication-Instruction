<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 250" font-family="-apple-system, Segoe UI, sans-serif" font-size="14">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8a8a8a"/></marker>
  </defs>
  <rect width="900" height="250" rx="12" fill="#232323"/>
  <!-- computer side -->
  <rect x="20" y="95" width="90" height="50" rx="6" fill="#444"/>
  <text x="65" y="117" fill="#eee" text-anchor="middle" font-weight="600">1. Design</text>
  <text x="65" y="135" fill="#bbb" text-anchor="middle" font-size="12">KiCad</text>
  <line x1="110" y1="120" x2="140" y2="120" stroke="#8a8a8a" stroke-width="2" marker-end="url(#a)"/>
  <rect x="142" y="95" width="90" height="50" rx="6" fill="#444"/>
  <text x="187" y="117" fill="#eee" text-anchor="middle" font-weight="600">2. Prepare</text>
  <text x="187" y="135" fill="#bbb" text-anchor="middle" font-size="12">pcb-cam</text>
  <line x1="232" y1="120" x2="262" y2="120" stroke="#8a8a8a" stroke-width="2" marker-end="url(#a)"/>
  <!-- manufacture group -->
  <rect x="264" y="40" width="540" height="170" rx="10" fill="none" stroke="#666" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="534" y="62" fill="#aaa" text-anchor="middle" font-size="12">3. Manufacture</text>
  <g font-weight="600" text-anchor="middle">
    <rect x="280" y="95" width="80" height="50" rx="6" fill="#2f5a3c"/><text x="320" y="117" fill="#eee">CNC</text><text x="320" y="134" fill="#cde" font-size="11" font-weight="400">pins, stock</text>
    <rect x="384" y="95" width="80" height="50" rx="6" fill="#2f5a3c"/><text x="424" y="117" fill="#eee">Laser</text><text x="424" y="134" fill="#cde" font-size="11" font-weight="400">jig, copper</text>
    <rect x="488" y="95" width="80" height="50" rx="6" fill="#2f5a3c"/><text x="528" y="117" fill="#eee">Bench</text><text x="528" y="134" fill="#cde" font-size="11" font-weight="400">paint mask</text>
    <rect x="592" y="95" width="80" height="50" rx="6" fill="#2f5a3c"/><text x="632" y="117" fill="#eee">Laser</text><text x="632" y="134" fill="#cde" font-size="11" font-weight="400">mask, silk</text>
    <rect x="696" y="95" width="90" height="50" rx="6" fill="#2f5a3c"/><text x="741" y="117" fill="#eee">CNC</text><text x="741" y="134" fill="#cde" font-size="11" font-weight="400">drill, cut out</text>
  </g>
  <g stroke="#8a8a8a" stroke-width="2">
    <line x1="360" y1="120" x2="382" y2="120" marker-end="url(#a)"/>
    <line x1="464" y1="120" x2="486" y2="120" marker-end="url(#a)"/>
    <line x1="568" y1="120" x2="590" y2="120" marker-end="url(#a)"/>
    <line x1="672" y1="120" x2="694" y2="120" marker-end="url(#a)"/>
    <line x1="804" y1="120" x2="828" y2="120" marker-end="url(#a)"/>
  </g>
  <rect x="830" y="100" width="56" height="40" rx="6" fill="#444"/>
  <text x="858" y="125" fill="#eee" text-anchor="middle" font-weight="600">PCB</text>
  <text x="534" y="190" fill="#aaa" text-anchor="middle" font-size="12">steps 1 → 6</text>
</svg>
